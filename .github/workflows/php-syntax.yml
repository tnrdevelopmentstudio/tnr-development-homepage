name: PHP syntax
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Validate plugin PHP syntax
        run: php -l tnr-development-maintenance.php
